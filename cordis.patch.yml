# dsh-wishcoder-devteam — 生效配置（v0.0.208 起只留当前决策；历史理由见 docs/design-notes.md 与 CHANGELOG）
#
# 1 单入口：只有 devteam 一个 preset（原 wishcoder 已折叠为 persona 的「许愿：」路由，0 次选用后合并）。
# 2 许愿细则在 skills/wish-loop + verify-harness（技能正文不进前缀缓存）；persona 只留触发、契约与例外。
# 3 persona 是每请求重付的常驻层：放言行契约，不放环境事实（→ 项目 AGENTS.md）与领域招式（→ 技能）。
# 4 preset 的 plugins 只放 agent/session 作用域行；内核服务（permission / subagent-model-selection）一律放 profile 层。
# 5 技能目录是绝对路径：换安装位置需改 customSkillDirs，然后 node validate.cjs。

- insert:
    - id: preset-devteam
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: devteam
        name: 'DevTeam-20 · 资深融合开发团队'
        description: '改现有代码/修 Bug/小改，或「许愿：」从零做一个东西。20 年经验融合（产品/前端/后端/Android/固件）：最小 diff 直接改；整页整功能走验收先行、全绿才交付。'
        order: 20
        plugins:
          # ⚠ 别在这里（preset 的 plugins 列表里）声明 `- id: permission`：
          # `@deepseek-ai/dsh-permission-presets` 注册的是**内核级服务** permissionPresets
          # （lib/index.js:170 `super(ctx, "permissionPresets")`）。preset 作用域再挂一次会得到
          # `Error: service "permissionPresets" has been registered at <PermissionPresetService>`
          # → devteam 预设组装失败 → **新建会话直接失败**（2026-10-28 14:10 起每次新建都报，
          # 证据：C:\Users\Administrator\.dsh\logs\desktop-next.log 的 host.kernel.permission-preset-service 段）。
          # `defaultPreset: danger-full-access` 只能写在 **profile 层**
          # （C:\Users\Administrator\.dsh\profiles\desktop\cordis.patch.yml，profile 层最后生效）；
          # 理由、代价与回滚见 .research/blindspots-v21.md §7。
          # 规则：preset 的 plugins 列表只放 agent/session 作用域的行，内核服务行一律放 profile 层覆写。
          # v26~v29 的变更记录（persona 字数、跨路由必被拒、五段流水线、守注意力/测试报告）已迁 docs/design-notes.md。
          # 现行硬约束三条：内核服务行只放 profile 层；persona ≤1000 字符且只放契约；派发一律同路由（跨路由必被拒）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                DevTeam（产品+前后端+桌面+Android+固件）。目标：最小 diff、最少 token、最快。

                输出：只报改动文件+一行理由（≤10 字）；不解释/总结/寒暄/列计划/贴代码/复述结果；失败多一行；技能声明了交付格式时以其为准。

                范围：先定位唯一最小改动点；禁整文件重写、无关格式化、顺手优化；架构只动接口与调用关系；>3 文件先问「扩范围？」，许愿不适用。

                许愿：「许愿：」/整页/整功能/从零 → wish-loop 五段：需求转译出 SPEC+分派表 → 按写域并行派领域子智能体实现（禁改验收）→ 验收专家按 AC 跑 verify，另派只读质量评审 → 功能测试一轮并出 TEST-REPORT.md → 清过程件、全绿才报，红报真状态；子代理先出规划，派后锁写域；单愿派发≤4；不提问（删改数据/账号付费/工作量相差>10 倍除外）。

                升级：新页面/弹窗、契约变更 → 首个 edit 前写 ≤3 行（改什么/怎么验/回滚）。

                底线：不臆造 API/字段/路径；不删用户代码；自测必跑，成功不贴结果；不跑破坏性命令、不 push/reset；密钥只从环境读。

                步数：一步并发 2~4 个只读调用（单调用<30%）；先 grep -n 再局部读；成功不重跑、失败换参。

                改动：源码只用 write/edit，禁 pwsh 写；edit 前先 read；EIO 整写；注释只写为什么。

                验证：改动攒批跑一条验收命令；红测先读断言；界面证据一次读图。

                记忆：项目 NOTES/CODE-MAP/AGENTS，先 grep 再读；环境事实写项目 AGENTS.md，别重读。

                成本：request/ask；子代理同路由；X=折叠/总input<0.5 不压；wait≤60s。

                技能：先 skill；devteam-flow、requirement-translator、acceptance-verifier、web-platform、android-app、embedded-firmware、debug-research、win-desktop、wish-loop/verify-harness；文档/视频/表格先 office 技能或切 standard；新角色须批准。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
              maxSourceBytes: 131072
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
            config:
              refreshIntervalMs: 3600000
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # 单次 read 的硬上限：默认 51200B/2000 行 = 单次最多约 12.8k token。
              # 261 条 >6144 字符的结果里最大 53k 字符，全是 read/pwsh 灌进来的。
              readLimit: 800
              readMaxLineLength: 800
              readMaxBytes: 24576
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              globMaxResults: 40
              grepMaxMatches: 120
          - id: repeat-tool-reminder
            name: '@deepseek-ai/dsh-repeat-tool-reminder'
            config:
              # 阈值前 0 token；只在完全相同的调用反复出现时注入一条小提示（走 additionalContexts，追加不改前缀缓存）。
              # 实测：15 次同会话完全重复命令、5.7% 工具错误（edit/pwsh 为主），提前到第 2 次就提醒。
              thresholds: [2, 4, 7]
              # 轮询/记账类工具重复是正常的，不计入链。
              exclude: [todo_write, job_output, job_list, wait_agent, compress]
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              # 目录监听会在技能目录变动时整条重发目录消息 = 缓存断点；技能很少改，关掉。
              watch: false
              customSkillDirs:
                - 'D:\agent\dsh-wishcoder-devteam\skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            config:
              catalogDescriptionMaxLength: 80
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式，直到用户通过 exit_plan_mode 批准计划或切换会话模式。用户用命令式语气要求实现，意为"规划实现方案"而非立刻执行；用户口头同意也不构成批准。

                    先探索：用只读读取、搜索、静态分析把计划建立在真实仓库上。不要编辑/写入文件、改配置、运行会改写受管文件的格式化或代码生成、提交。优先复用既有函数与模式。

                    工具目录在各模式间保持一致；这些规则优先于工具描述。规划阶段不要用 todo_write，它跟踪的是获批后的实现。

                    能查清的事实就查清，不要问用户代码在哪；ask_user_question 只用于用户才能做的选择。

                    计划要决策完备：目标与验收标准；按子系统分组的改动；公共 API/schema/数据流变化；边界、失败模式、测试、假设。精简到能快速评审，又详细到另一位工程师不必再做设计决策。

                    准备好后调用 exit_plan_mode 传完整 markdown 计划（以 # 开头），且它必须是那次回复中唯一且最后的工具调用；被打回则吸收反馈重新提交。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # 默认 maxTokens=headroomTokens=65536，摘要输出（含推理）过肥；16k 足够。
                  maxTokens: 16384
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  # 只在压缩触发时生效；trim 得更早，减小压缩时要重写的体积。
                  thresholdChars: 4096
                  headChars: 1536
                  tailChars: 384
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # v25：dsh-tool-subagent-control 0.2.2 起 exports 只剩 "."（旧
              # "@deepseek-ai/dsh-tool-subagent-control/list-agents" 子路径已删），其主入口
              # lib/index.js:154 apply 已自带注册 list_agents/send_message/interrupt_agent，
              # 故原 tool-subagent-list-agents 行整行删除；保留 control 即保留这三个工具。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  # v26.1（T6 r3 实测修正）：modelSelection 改回 false。
                  # 原意是让段 2 显式派 flash；但运行时在 dsh-tool-subagent/lib/index.js:85
                  # assertAllowedModelSelection 里先查 Session 的 subagentModelSelectionPolicy：
                  # 无 policy 时显式选择必须等于父路由，否则抛
                  #   child LLM route "…/deepseek-v4.1-flash" is not allowed for this Session;
                  #   without a recorded model-selection policy, explicit selection is limited to the parent route
                  # 该 policy 是会话级持久状态（stateVersion 1、init null，经 subagent/model-selection-policy
                  # 事件写入，surface false）。
                  # v27（2026-11-20）→ v29.2（2026-11-21）：policy 的写者换成 profile 层官方
                  # subagent-model-selection-settings 行（enabled + allowedModels），在新顶层
                  # 会话 created 时写入，子代理会话继承父会话白名单。
                  # 故这里改回 true：不开时请求会先被
                  #   "child model selection is disabled for this tool instance" 挡掉，根本走不到 policy。
                  # 代价：+3 个可选参数 ≈+220 字符 schema ≈+60 tok/请求。
                  # policy 没写成时仍会被拒（"… is not allowed for this Session"），退回不传即可。
                  # modelDiscovery 仍 false。
                  modelSelection: true
                  # v28（2026-11-21，用户要求）：深度 1 → 2。领域子智能体（写域一级）
                  # 可再下派一层执行子智能体；深度 2 到顶被提示「直接做」（dsh-tool-subagent
                  # lib/index.js:521 `depth < maxDepth` 才放行）。不写时由 dsh-subagent 服务默认 1。
                  # 代价：每多一层 = 再一次冷前缀（≈58k input）；只在该域有 ≥2 个独立文件块时用。
                  maxDepth: 2
              # v4 不再挂 fork provider：subagent_fork 会继承父会话全量上下文，
              # 单次调用成本最高。需要协作时用 subagent（spawn）+ 精简任务书。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            # v22：devteam 会话实测 web_search 10 次调用 5 次失败（DeepSeek search 无 DEEPSEEK_API_KEY），
            # 技能正文零依赖 web_search；行保留给 validate.cjs，禁用后每请求少 323 字符 schema（≈90 tok）。
            # 要恢复：先在 credentials 里配 DEEPSEEK_API_KEY，再删这一行。
            # v29.3（2026-11-21）：disabled 行不注册工具，原 config（fetch/searchTimeoutMs/searchMax*）
            # 是死配置、永不读，已删；恢复时补回 `fetch: false`（不抓整页）+ `searchMaxResults: 3`。
            disabled: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # v29.2（2026-11-21）：这一行从 preset 移到 profile 层
          # （C:\Users\Administrator\.dsh\profiles\desktop\cordis.patch.yml 末尾）。
          # 原因：`subagent-model-selection-settings` 注册的是全局服务名
          # `subagentModelSelection`，而 preset 的 plugins 会被每条会话/preset 实例各装配一次，
          # 于是在启动时报
          #   Error: service "subagentModelSelection" has been registered at <SubagentModelSelectionConfig>
          # （2026-11-20T16:42:27.060Z 日志原文）。放到 profile 层只装一次，服务不再重复注册。
          # 配置（enabled + allowedModels）也随行搬走；设置页 dsh-devteam-settings 编辑同一命名空间。
          # v29.1（2026-11-21）：设置页搬出去成独立包 dsh-devteam-settings。
          # 原先在这里挂了一行 name: 'dsh-wishcoder-devteam' 想借 bundle 根包当 client 宿主，
          # 浏览器里没出现页面。原因判断：`dsh.client` 由 client-modules 按「Loader 行的包」
          # 解析（lib/index.js:783 resolveMeta → locatePkgJson → 包的 package.json），
          # 而 preset bundle 根包被 Loader 当作 bundle 展开，不是普通插件行，形态没被模板覆盖。
          # 现在这行删除，client 声明与页面都在 D:\agent\dsh-devteam-settings（装进 profile），
          # 它注册 plugins.bundle.config（key=包名）与 plugins.row.config（key=包名#行id），
          # 编辑的仍是上面这行拥有的 subagent-model-selection 命名空间。
